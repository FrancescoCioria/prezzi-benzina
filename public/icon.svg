<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="102" fill="#1a1a2e"/>
  <!-- Fuel pump icon -->
  <g transform="translate(106, 86) scale(0.6)" fill="none" stroke="#22c55e" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <!-- Pump body -->
    <rect x="40" y="80" width="260" height="380" rx="20" fill="#22c55e" opacity="0.15" stroke="#22c55e"/>
    <!-- Nozzle screen -->
    <rect x="90" y="140" width="160" height="100" rx="10" fill="#1a1a2e" stroke="#22c55e"/>
    <!-- Hose arm -->
    <path d="M300 180 L380 180 L380 300 Q380 340 360 340 L340 340" stroke="#22c55e"/>
    <!-- Nozzle -->
    <path d="M340 340 L340 380 L310 400" stroke="#22c55e" stroke-width="24"/>
    <!-- Base -->
    <rect x="20" y="460" width="300" height="30" rx="8" fill="#22c55e" opacity="0.3" stroke="none"/>
    <!-- Price text -->
    <text x="170" y="430" font-family="sans-serif" font-size="60" font-weight="bold" fill="#22c55e" text-anchor="middle" stroke="none">€/L</text>
  </g>
</svg>
